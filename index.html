<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP — Developer & Generalist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --amber: #f5a623;
            --amber-light: #ffd080;
            --amber-dark: #c47d00;
            --bg: #f0ece4;
            --bg-card: #ffffff;
            --bg-dark: #111010;
            --text: #111010;
            --text-muted: #7a7570;
            --border: rgba(0,0,0,0.08);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        /* ── BENTO GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: auto;
            gap: 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--border);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }

        /* ── HERO CARD ── */
        .card--hero {
            grid-column: span 7;
            background: var(--bg-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 320px;
            padding: 2.5rem;
        }

        .card--hero::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 280px; height: 280px;
            background: radial-gradient(circle, var(--amber) 0%, transparent 70%);
            opacity: 0.25;
            pointer-events: none;
        }

        .hero-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--amber);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hero-label::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--amber);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(245,166,35,0.4); }
            50%       { opacity: 0.6; box-shadow: 0 0 0 6px rgba(245,166,35,0); }
        }

        .hero-name {
            font-family: 'Syne', sans-serif;
            font-size: clamp(4.5rem, 12vw, 8rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .hero-name span {
            color: var(--amber);
        }

        .hero-role {
            font-size: 0.85rem;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.05em;
        }

        /* ── TAGLINE CARD ── */
        .card--tagline {
            grid-column: span 5;
            background: var(--amber);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 320px;
        }

        .tagline-text {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            line-height: 1.2;
            color: var(--bg-dark);
        }

        .tagline-attr {
            margin-top: 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(0,0,0,0.4);
            letter-spacing: 0.05em;
        }

        /* ── FACEBOOK CARD ── */
        .card--facebook {
            grid-column: span 4;
            background: #1877f2;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            text-decoration: none;
            min-height: 200px;
        }

        .card--facebook:hover {
            background: #1565d8;
        }

        .card--facebook .card-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .card--facebook .card-action {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card--facebook .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card--facebook .card-icon {
            width: 48px; height: 48px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .card--facebook:hover .card-icon {
            background: rgba(255,255,255,0.3);
        }

        /* ── GITHUB CARD ── */
        .card--github {
            grid-column: span 4;
            background: var(--bg-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            text-decoration: none;
            min-height: 200px;
        }

        .card--github .card-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.4;
        }

        .card--github .card-action {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card--github .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card--github .card-icon {
            width: 48px; height: 48px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .card--github:hover .card-icon {
            background: rgba(255,255,255,0.2);
        }

        /* ── STACK CARD ── */
        .card--stack {
            grid-column: span 4;
            background: var(--bg-card);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card--stack .card-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .stack-pills {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg);
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
            transition: background 0.2s;
        }

        .pill:hover { background: #e5e0d8; }

        .pill-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .pill-dot--react   { background: #61dafb; }
        .pill-dot--net     { background: #512bd4; }
        .pill-dot--n8n     { background: #ea4b71; }

        /* ── AVAILABLE CARD ── */
        .card--available {
            grid-column: span 12;
            background: var(--bg-card);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: auto;
        }

        .card--available:hover {
            transform: none;
            box-shadow: none;
        }

        .available-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        .available-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #22c55e;
        }

        .available-status::before {
            content: '';
            width: 8px; height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-green 2s ease-in-out infinite;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            50%       { opacity: 0.7; box-shadow: 0 0 0 5px rgba(34,197,94,0); }
        }

        svg { display: block; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .card--hero, .card--tagline,
            .card--facebook, .card--github, .card--stack { grid-column: span 12; }
            .card--hero { min-height: 260px; }
            .card--tagline { min-height: 200px; }
        }

        @media (min-width: 769px) and (max-width: 960px) {
            .card--hero { grid-column: span 12; }
            .card--tagline { grid-column: span 12; min-height: 180px; }
            .card--facebook, .card--github, .card--stack { grid-column: span 4; }
        }
    </style>
</head>
<body>
    <div class="grid">

        <!-- HERO -->
        <div class="card card--hero">
            <div class="hero-label">Developer &amp; Generalist</div>
            <div>
                <h1 class="hero-name">P<span>P</span></h1>
                <p class="hero-role">Building with intention.</p>
            </div>
        </div>

        <!-- TAGLINE -->
        <div class="card card--tagline">
            <div></div>
            <div>
                <p class="tagline-text">Begin with<br>the end<br>in mind.</p>
                <p class="tagline-attr">— PP's principle</p>
            </div>
        </div>

        <!-- FACEBOOK -->
        <a href="https://www.facebook.com/phakh.phumi.wa.li.prakhon"
           target="_blank" rel="noopener noreferrer"
           class="card card--facebook">
            <span class="card-label">Contact</span>
            <div class="card-action">
                <span class="card-title">Facebook</span>
                <span class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </span>
            </div>
        </a>

        <!-- GITHUB -->
        <a href="https://github.com/PooMz2"
           target="_blank" rel="noopener noreferrer"
           class="card card--github">
            <span class="card-label">Code</span>
            <div class="card-action">
                <span class="card-title">GitHub</span>
                <span class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                    </svg>
                </span>
            </div>
        </a>

        <!-- STACK -->
        <div class="card card--stack">
            <span class="card-label">Stack</span>
            <div class="stack-pills">
                <div class="pill">
                    <span class="pill-dot pill-dot--react"></span>
                    React
                </div>
                <div class="pill">
                    <span class="pill-dot pill-dot--net"></span>
                    ASP.NET Core API
                </div>
                <div class="pill">
                    <span class="pill-dot pill-dot--n8n"></span>
                    n8n
                </div>
            </div>
        </div>

        <!-- STATUS BAR -->
        <div class="card card--available">
            <span class="available-text">PP &mdash; Developer &amp; Generalist &mdash; 2026</span>
            <span class="available-status">Available for work</span>
        </div>

    </div>
</body>
</html>
